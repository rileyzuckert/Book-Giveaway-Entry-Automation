name: Weekly giveaways

on:
  schedule:
    - cron: "0 15 * * 1"        # Mondays 15:00 UTC (edit to taste)
  workflow_dispatch:
    inputs:
      live:
        description: "Actually enter giveaways? (unchecked = dry run)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GR_EMAIL: ${{ secrets.GR_EMAIL }}
      GR_PASSWORD: ${{ secrets.GR_PASSWORD }}
      SG_EMAIL: ${{ secrets.SG_EMAIL }}
      SG_PASSWORD: ${{ secrets.SG_PASSWORD }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      MY_COUNTRY: ${{ vars.MY_COUNTRY }}          # e.g. United States
      PLATFORMS: ${{ vars.PLATFORMS }}            # "storygraph" or "goodreads,storygraph"
      SELECTORS_URL: ${{ vars.SELECTORS_URL }}    # optional: raw URL of selectors.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium

      - name: Restore saved login session + entered-giveaways list
        uses: actions/cache/restore@v4
        with:
          path: |
            browser_profile
            state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run bot
        run: python giveaway_bot.py --once ${{ (github.event_name == 'schedule' || inputs.live) && '--live' || '' }}

      - name: Save login session + entered-giveaways list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            browser_profile
            state.json
          key: bot-state-${{ github.run_id }}

      - name: Keep log for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giveaway-log
          path: giveaway_bot.log
          retention-days: 7

      - name: Keep debug screenshots for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giveaway-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
